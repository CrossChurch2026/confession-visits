<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>سجل زيارات الاعتراف</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#8B1538">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="الاعتراف">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  /* ===== الهوية البصرية: خمري + ذهبي ===== */
  :root {
    --pri:#8B1538;
    --pri2:#6B0F2B;
    --pri-soft:#F8EDEF;
    --gold:#D4AF37;
    --gold-l:#F8EBC8;
    --gold-pale:#FFF9EA;
    --bg:#FAF6E9;
    --ink:#452B2B;
    --mute:#8A716B;
    --card:#FFFFFF;
    --line:#E9DCC5;
    --ok:#2E7D32;
    --shadow:0 8px 24px rgba(91,34,48,.09);
  }
  * { box-sizing:border-box; }
  html { background:var(--bg); }
  body {
    margin:0; min-height:100vh; color:var(--ink);
    font-family:Cairo,"Segoe UI",Tahoma,Arial,sans-serif;
    background:radial-gradient(ellipse at top, #fffdf7 0, var(--bg) 58%, #F5EBD8 100%);
  }
  button,input,select { font-family:inherit; }

  /* الشريط العلوي */
  header.top {
    position:relative; overflow:hidden; color:#fff;
    padding:18px 16px 46px;
    background:linear-gradient(135deg,#5D0C26 0%,var(--pri) 58%,#A52A4A 100%);
    box-shadow:0 5px 18px rgba(91,12,38,.18);
    border-bottom:3px solid var(--gold);
  }
  header.top:before, header.top:after {
    content:""; position:absolute; border:1px solid rgba(232,197,112,.24);
    border-radius:50%; pointer-events:none;
  }
  header.top:before { width:210px; height:210px; left:-80px; top:-125px; }
  header.top:after { width:145px; height:145px; left:-48px; top:-91px; }
  .hrow { position:relative; z-index:2; display:flex; align-items:center; gap:12px; }
  .cross { width:38px; height:56px; flex:none; filter:drop-shadow(0 2px 4px rgba(0,0,0,.18)); }
  .ttl strong { display:block; font-size:21px; font-weight:800; line-height:1.4; }
  .ttl small { color:#F2D98D; font-size:13px; }
  .hbtn {
    margin-right:auto; display:flex; align-items:center; gap:6px;
    background:var(--gold-pale); color:var(--pri);
    border:1px solid var(--gold); border-radius:11px;
    font-weight:700; font-size:13px; padding:9px 13px;
    box-shadow:0 3px 9px rgba(0,0,0,.12);
  }
  .hbtn:hover { background:#fff; }
  .church { position:absolute; left:6px; bottom:13px; width:112px; opacity:.22; z-index:1; }
  .wave { position:absolute; left:0; right:0; bottom:-1px; width:100%; height:27px; z-index:2; }

  /* التبويبات */
  nav {
    display:flex; gap:8px; padding:0 12px 7px; overflow-x:auto;
    margin-top:-5px; position:relative; z-index:3;
    scrollbar-width:thin; scrollbar-color:var(--gold) transparent;
  }
  nav button {
    display:flex; align-items:center; gap:7px; white-space:nowrap;
    background:#FFFEFA; color:var(--ink); border:1px solid var(--line);
    border-radius:13px; padding:11px 15px; font-weight:700;
    box-shadow:0 3px 10px rgba(76,43,36,.08); transition:.18s ease;
  }
  nav button:hover { border-color:var(--gold); transform:translateY(-1px); }
  nav button.on {
    background:linear-gradient(135deg,var(--pri),var(--pri2));
    color:#fff; border-color:var(--pri); box-shadow:0 5px 13px rgba(139,21,56,.2);
  }
  nav button.on .ic { color:var(--gold); }
  .ic { width:18px; height:18px; flex:none; }

  main { padding:18px 12px 8px; max-width:1000px; margin:0 auto; }
  .card {
    background:var(--card); border:1px solid var(--line); border-radius:18px;
    padding:16px; margin-bottom:17px; box-shadow:var(--shadow); overflow:hidden;
  }
  .card h3 { margin:0 0 13px; color:var(--pri); font-weight:800; }
  .card h3.band {
    display:flex; align-items:center; gap:9px;
    background:linear-gradient(100deg,var(--pri2),var(--pri)); color:#fff;
    margin:-16px -16px 16px; padding:13px 16px; font-size:17px;
    border-bottom:2px solid var(--gold);
  }
  .card h3.band .ic { color:#F1D477; width:21px; height:21px; }

  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:end; }
  .row > label {
    display:flex; flex-direction:column; gap:6px; font-size:13px;
    color:var(--mute); flex:1 1 150px; font-weight:700;
  }
  input,select {
    padding:11px 12px; border:1px solid #E4D8C8; border-radius:11px;
    font:inherit; width:100%; background:#FFFCF6; color:var(--ink);
    min-height:44px; transition:border-color .18s, box-shadow .18s;
  }
  input::placeholder { color:#A9958B; }
  input:focus,select:focus {
    outline:none; border-color:var(--gold);
    box-shadow:0 0 0 3px rgba(212,175,55,.17); background:#fff;
  }
  button {
    background:linear-gradient(135deg,var(--pri),var(--pri2)); color:#fff;
    border:0; border-radius:11px; padding:10px 17px; cursor:pointer;
    font:inherit; font-weight:700; transition:transform .16s,box-shadow .16s,background .16s;
    box-shadow:0 3px 8px rgba(139,21,56,.13);
  }
  button:hover { background:var(--pri2); box-shadow:0 5px 12px rgba(139,21,56,.2); }
  button:active { transform:translateY(1px); }
  button.sec { background:#fff; color:var(--pri); border:1px solid #C88B9B; box-shadow:none; }
  button.sec:hover { background:var(--pri-soft); border-color:var(--pri); }
  button.danger { background:#fff; color:#B4233D; border:1px solid #E2AAB5; box-shadow:none; }
  button.danger:hover { background:#FFF1F3; }
  button.sm { padding:7px 11px; font-size:13px; white-space:nowrap; }
  .acts { display:flex; flex-direction:column; gap:5px; align-items:stretch; }

  .tw { overflow-x:auto; border-radius:12px; border:1px solid var(--line); }
  table { width:100%; border-collapse:separate; border-spacing:0; font-size:14px; }
  th,td { text-align:right; padding:11px 9px; border-bottom:1px solid #EEE5D8; vertical-align:middle; }
  th { background:linear-gradient(180deg,#F8EBC8,#F3E2B4); color:#583B2D; font-weight:800; white-space:nowrap; }
  tbody tr:nth-child(even) { background:#FFFCF7; }
  tbody tr:hover { background:#FFF7E7; }
  tbody tr:last-child td { border-bottom:0; }

  .msg { min-height:22px; color:var(--pri); font-size:14px; margin-bottom:6px; font-weight:700; }
  .center { text-align:center; padding:40px 12px; }
  .login { max-width:400px; margin:26px auto; padding:0 12px; }
  .login .card > * { margin-bottom:10px; }
  .tag { font-size:12px; padding:3px 9px; border-radius:20px; background:#F4EEE5; color:var(--ink); }
  .tag.ok { background:#E6F4E8; color:var(--ok); }
  hr { border:0; border-top:1px solid var(--line); }
  small { color:var(--mute); }

  /* الزخرفة السفلية */
  .orn { display:flex; align-items:center; gap:10px; padding:8px 24px 28px; max-width:1000px; margin:0 auto; }
  .orn span { flex:1; height:2px; background:linear-gradient(90deg,transparent,var(--gold)); }
  .orn span:last-child { transform:scaleX(-1); }
  .orn svg { width:24px; height:36px; flex:none; }

  @media (max-width:520px) {
    header.top { padding:15px 13px 42px; }
    .ttl strong { font-size:18px; }
    .ttl small { font-size:12px; }
    .cross { width:31px; height:48px; }
    .hbtn { padding:8px 9px; font-size:12px; }
    main { padding:14px 10px 6px; }
    .card { padding:13px; border-radius:16px; margin-bottom:14px; }
    .card h3.band { margin:-13px -13px 14px; padding:11px 13px; }
    .row { gap:8px; }
    nav button { padding:9px 12px; }
    th,td { padding:8px 5px; font-size:12px; }
    .orn { padding-bottom:22px; }
  }
  @media (prefers-reduced-motion:reduce) { *,*:before,*:after { transition:none !important; } }
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="app.js"></script>
</body>
</html>
