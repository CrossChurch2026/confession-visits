<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>سجل زيارات الاعتراف</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#8B1538">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="الاعتراف">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  /* ===== الألوان (غيّرها من هنا فقط) ===== */
  :root {
    --pri:#8B1538;      /* خمري داكن */
    --pri2:#6b0f2b;     /* خمري أغمق (تدرّج / ضغط) */
    --gold:#D4AF37;     /* ذهبي */
    --gold-l:#F3E3B0;   /* ذهبي فاتح (عناوين الجداول) */
    --bg:#FAF6E9;       /* كريمي */
    --ink:#5D4037;      /* بني داكن (النص) */
    --mute:#8d6e63;     /* بني فاتح */
    --card:#FFFFFF;     /* أبيض */
    --line:#eadfc4;
    --ok:#2e7d32;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Cairo,"Segoe UI",Tahoma,Arial,sans-serif; background:linear-gradient(var(--bg),#f6efd9); color:var(--ink); min-height:100vh; }

  /* ===== الشريط العلوي ===== */
  header.top { position:relative; overflow:hidden; color:#fff; padding:14px 16px 42px;
    background:linear-gradient(135deg,var(--pri2),var(--pri) 60%,#a3203f); }
  .hrow { position:relative; z-index:2; display:flex; align-items:center; gap:12px; }
  .cross { width:34px; height:52px; flex:none; }
  .ttl strong { display:block; font-size:21px; font-weight:800; line-height:1.35; }
  .ttl small { color:#EBD283; font-size:13px; }
  .hbtn { margin-right:auto; display:flex; align-items:center; gap:6px; background:var(--bg); color:var(--pri);
    border:1px solid var(--gold); font-weight:600; font-size:13px; padding:8px 12px; }
  .hbtn:hover { background:#fff; }
  .church { position:absolute; left:6px; bottom:14px; width:112px; opacity:.3; z-index:1; }
  .wave { position:absolute; left:0; right:0; bottom:-1px; width:100%; height:26px; z-index:2; }

  /* ===== التبويبات ===== */
  nav { display:flex; gap:8px; padding:0 12px 4px; overflow-x:auto; margin-top:-6px; position:relative; z-index:3; }
  nav button { display:flex; align-items:center; gap:6px; white-space:nowrap; background:#fffdf5; color:var(--ink);
    border:1px solid var(--line); border-radius:12px; padding:10px 14px; font-weight:600;
    box-shadow:0 2px 6px rgba(93,64,55,.12); }
  nav button:hover { background:#fff; }
  nav button.on { background:var(--pri); color:#fff; border-color:var(--pri); }
  nav button.on .ic { color:var(--gold); }
  .ic { width:18px; height:18px; flex:none; }
  nav { scrollbar-width:none; }
  nav::-webkit-scrollbar { display:none; }
  select[size] { padding:4px; background:#fff; }
  select[size] option { padding:9px 8px; border-radius:6px; }
  select[size] option:checked { background:var(--pri) linear-gradient(0deg,var(--pri),var(--pri)); color:#fff; }

  main { padding:14px 12px 4px; max-width:1000px; margin:0 auto; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:14px;
    box-shadow:0 2px 8px rgba(93,64,55,.08); overflow:hidden; }
  .card h3 { margin:0 0 10px; color:var(--pri); }
  .card h3.band { display:flex; align-items:center; gap:8px; background:var(--pri); color:#fff;
    margin:-14px -14px 14px; padding:11px 14px; font-size:17px; }
  .card h3.band .ic { color:var(--gold); width:20px; height:20px; }

  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:end; }
  .row > label { display:flex; flex-direction:column; gap:4px; font-size:13px; color:var(--mute); flex:1 1 150px; font-weight:600; }
  input, select { padding:10px; border:1px solid var(--line); border-radius:10px; font:inherit; width:100%;
    background:#fcfaf2; color:var(--ink); }
  input:focus, select:focus { outline:2px solid var(--gold); border-color:var(--gold); }
  button { background:var(--pri); color:#fff; border:0; border-radius:10px; padding:10px 16px; cursor:pointer; font:inherit; font-weight:600; }
  button:hover { background:var(--pri2); }
  button.sec { background:#fff; color:var(--pri); border:1px solid var(--pri); }
  button.sec:hover { background:#fdf3f5; }
  button.danger { background:#fff; color:#b00020; border:1px solid #d9a0aa; }
  button.danger:hover { background:#fff1f3; }

  button.sm { padding:6px 10px; font-size:13px; white-space:nowrap; }
  .acts { display:flex; flex-direction:column; gap:4px; align-items:stretch; }
  @media (max-width:520px) { th, td { padding:8px 5px; font-size:13px; } .hm { display:none; } }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:right; padding:9px 8px; border-bottom:1px solid var(--line); vertical-align:middle; }
  th { background:var(--gold-l); color:var(--ink); font-weight:800; }
  .tw { overflow-x:auto; border-radius:10px; }

  .msg { min-height:22px; color:var(--pri); font-size:14px; margin-bottom:6px; font-weight:600; }
  .center { text-align:center; padding:40px 12px; }
  .login { max-width:380px; margin:24px auto; padding:0 12px; }
  .login .card > * { margin-bottom:10px; }
  .tag { font-size:12px; padding:2px 8px; border-radius:10px; background:#eee; }
  .tag.ok { background:#e3f1e4; color:var(--ok); }
  hr { border:0; border-top:1px solid var(--line); }
  small { color:var(--mute); }

  /* ===== الزخرفة السفلية ===== */
  .orn { display:flex; align-items:center; gap:10px; padding:6px 24px 26px; max-width:1000px; margin:0 auto; }
  .orn span { flex:1; height:2px; background:linear-gradient(90deg,transparent,var(--gold)); }
  .orn span:last-child { transform:scaleX(-1); }
  .orn svg { width:22px; height:34px; flex:none; }
</style>
</head>
<body>
<div id="app"></div>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
